<!-- ================= CONTACTO ================= -->

<section class="contacto">

    <div class="contenedor-contacto">

        <!-- Menú lateral -->
        <aside class="menu-contacto">

            <h3>Contacto Universidad Cóndor Unido</h3>

            <ul>
                <li class="activo">
                    <a href="#">Contáctenos <span>›</span></a>
                </li>

            </ul>

        </aside>

        <!-- Formulario -->
        <div class="formulario-contacto">

            <h2>Envíenos un mensaje</h2>

            <form action="#" method="post">

                <!-- Tipo de consulta -->
                <div class="fila">
                    <select name="asunto" required>
                        <option value="">Seleccione</option>
                        <option>Información académica</option>
                        <option>Admisiones</option>
                        <option>Matrículas</option>
                        <option>Soporte</option>
                    </select>
                </div>

                <!-- Nombres y Apellidos -->
                <div class="fila-doble">
                    <input
                        type="text"
                        name="nombre"
                        placeholder="Nombres"
                        required>

                    <input
                        type="text"
                        name="apellido"
                        placeholder="Apellidos"
                        required>
                </div>

                <!-- Ciudad y Teléfono -->
                <div class="fila-doble">

                    <input
                        type="text"
                        name="ciudad"
                        placeholder="Ciudad">

                    <input
                        type="tel"
                        name="telefono"
                        placeholder="Teléfono"
                        pattern="[0-9]{7,10}">

                </div>

                <!-- Correo y Celular -->
                <div class="fila-doble">

                    <input
                        type="email"
                        name="correo"
                        placeholder="Correo electrónico personal"
                        required>

                    <input
                        type="tel"
                        name="celular"
                        placeholder="Celular"
                        pattern="[0-9]{10}">

                </div>

                <!-- Mensaje -->

                <textarea
                    name="mensaje"
                    placeholder="Mensaje"
                    rows="8"
                    required></textarea>

                <!-- Botón -->

                <div class="boton">

                    <button type="submit">
                        Enviar
                    </button>

                </div>

            </form>

        </div>

    </div>

</section>
